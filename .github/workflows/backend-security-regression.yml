name: Backend security regression

on:
  push:
    branches: [fix/p0-idempotency-isolation, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker engine
        run: docker info
      - name: Build
        run: dotnet build src/backend/ServiceDesk.sln -c Release
      - name: Unit and architecture tests
        run: dotnet test src/backend/ServiceDesk.sln -c Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"
      - name: PostgreSQL and API integration tests
        run: dotnet test src/backend/ServiceDesk.sln -c Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
