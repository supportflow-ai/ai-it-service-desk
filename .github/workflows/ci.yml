name: Backend quality gates
on:
  push:
    branches: [main, dev, staging, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Phát hành image SHA lên GHCR sau khi toàn bộ kiểm tra đạt'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra nguồn và liên kết tài liệu
        run: python scripts/validate_project_docs.py
      - name: Kiểm tra công cụ tài liệu và nạp cấu hình
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Restore locked dependencies
        run: dotnet restore src/backend/ServiceDesk.sln --locked-mode
      - name: Build backend
        run: dotnet build src/backend/ServiceDesk.sln -c Release --no-restore
      - name: Unit, architecture and offline compatibility tests
        run: dotnet test src/backend/ServiceDesk.sln -c Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"
      - name: PostgreSQL integration tests
        run: dotnet test src/backend/ServiceDesk.sln -c Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"
      - run: python -m pip install -r contracts/requirements.txt
      - name: Validate AI contract and fixtures
        run: python scripts/validate_ai_contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests
          path: tests/**/TestResults/*.trx
      - uses: actions/upload-artifact@v4
        with:
          name: ai-contract-v1-${{ github.sha }}
          path: contracts/ai/v1/
      - name: Build API image
        run: docker build -f src/backend/ServiceDesk.Api/Dockerfile -t servicedesk-api:ci .
      - name: Build Worker image
        run: docker build -f src/backend/ServiceDesk.Worker/Dockerfile -t servicedesk-worker:ci .
      - name: Build database tool image
        run: docker build -f src/backend/ServiceDesk.Database/Dockerfile -t servicedesk-database:ci .

  publish:
    name: Phát hành image bất biến
    needs: backend
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.repository_owner == 'supportflow-ai' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: servicedesk-api
            dockerfile: src/backend/ServiceDesk.Api/Dockerfile
          - image: servicedesk-worker
            dockerfile: src/backend/ServiceDesk.Worker/Dockerfile
          - image: servicedesk-database
            dockerfile: src/backend/ServiceDesk.Database/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/supportflow-ai/${{ matrix.image }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Ghi bằng chứng digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Thiếu digest hợp lệ; không tạo bằng chứng phát hành.")
          image = os.environ["IMAGE"]
          output = pathlib.Path("artifacts") / (image + ".json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps({
              "repository": os.environ["SOURCE_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "images": {image: "ghcr.io/supportflow-ai/" + image + "@" + digest}
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-${{ matrix.image }}-${{ github.sha }}
          path: artifacts/*.json
