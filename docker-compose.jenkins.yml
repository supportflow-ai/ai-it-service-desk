# docker-compose.jenkins.yml — Local Jenkins CI for AI IT Service Desk
# Usage: docker compose -f deploy/jenkins/docker-compose.jenkins.yml up --build -d
#
# Jenkins UI: http://localhost:8080
# Login: admin / admin
# Pipeline: servicedesk-ci

services:
  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    container_name: jenkins-servicedesk
    hostname: jenkins
    user: root
    ports:
      - "8080:8080"    # Jenkins web UI
      - "50000:50000"  # Agent JNLP port (for future agents)
    volumes:
      # Persist Jenkins home (jobs, builds, config)
      - jenkins_home:/var/jenkins_home
      # Docker-outside-of-Docker: Jenkins can run docker commands on the host
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the project so Jenkins can checkout via file:// git protocol
      - .:/workspace
      # JCasC config
      - ./deploy/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
      # Testcontainers: when running inside Docker, containers are reachable
      # via host.docker.internal (Docker Desktop) instead of 127.0.0.1
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  jenkins_home:
    name: jenkins-servicedesk-home
