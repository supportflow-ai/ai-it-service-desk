# ============================================
# Docker Compose Override — Development
# ============================================
# Exposes additional ports for local development.
# This file is automatically used by `docker compose up`.

services:
  postgres:
    ports:
      - "5432:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api-1:
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  api-2:
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  worker:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
