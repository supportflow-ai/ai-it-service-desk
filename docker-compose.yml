# ============================================
# AI IT Service Desk — Docker Compose
# ============================================
# Services: nginx, frontend, api-1, api-2, worker, postgres, minio
#
# Usage:
#   docker compose up --build
#   docker compose down -v  (removes volumes too)
# ============================================

services:
  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - servicedesk

  # --- Frontend ---
  frontend:
    build:
      context: .
      dockerfile: src/frontend/service-desk-web/Dockerfile
    networks:
      - servicedesk

  # --- API instances ---
  api-1:
    build:
      context: .
      dockerfile: src/backend/ServiceDesk.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__ConnectionString=Host=postgres;Port=5432;Database=servicedesk;Username=servicedesk;Password=${POSTGRES_PASSWORD:-changeme}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-development_secret_key_minimum_32_characters_long}
      - Jwt__Issuer=ServiceDesk
      - Jwt__Audience=ServiceDeskClient
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Minio__Bucket=servicedesk
      - Minio__UseSsl=false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - servicedesk

  api-2:
    build:
      context: .
      dockerfile: src/backend/ServiceDesk.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__ConnectionString=Host=postgres;Port=5432;Database=servicedesk;Username=servicedesk;Password=${POSTGRES_PASSWORD:-changeme}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-development_secret_key_minimum_32_characters_long}
      - Jwt__Issuer=ServiceDesk
      - Jwt__Audience=ServiceDeskClient
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Minio__Bucket=servicedesk
      - Minio__UseSsl=false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - servicedesk

  # --- Background Worker ---
  worker:
    build:
      context: .
      dockerfile: src/backend/ServiceDesk.Worker/Dockerfile
    environment:
      - Database__ConnectionString=Host=postgres;Port=5432;Database=servicedesk;Username=servicedesk;Password=${POSTGRES_PASSWORD:-changeme}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Minio__Bucket=servicedesk
      - Minio__UseSsl=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - servicedesk

  # --- PostgreSQL + pgvector ---
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=servicedesk
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=servicedesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicedesk

  # --- MinIO ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicedesk

volumes:
  postgres_data:
  minio_data:

networks:
  servicedesk:
    driver: bridge
